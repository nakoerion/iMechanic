<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>iMechanic</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070d18;
        color: #f5f7fb;
        font:
          16px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 24px;
      }
      main {
        max-width: 30rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 0.75rem;
        color: #c3cddf;
      }
      a.button {
        display: inline-block;
        margin-top: 0.5rem;
        min-height: 48px;
        padding: 0.75rem 1.25rem;
        border-radius: 12px;
        background: #fbbf24;
        color: #16130a;
        font-weight: 600;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 1.5rem;
        color: #8b98ae;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>iMechanic</h1>
      <p>
        This is the bundled shell. The iMechanic app is served from its own
        origin, so the normal build opens the deployed app directly.
      </p>
      <a class="button" href="https://www.imechanic.app/app">Open iMechanic</a>
      <small>
        If you are seeing this page inside the installed app, the app was built
        without a server URL configured. See <code>native/README.md</code>.
      </small>
    </main>
  </body>
</html>
