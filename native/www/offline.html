<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>iMechanic — no connection</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070d18;
        color: #f5f7fb;
        font:
          16px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 24px;
      }
      main {
        max-width: 30rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 0.75rem;
        color: #c3cddf;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
      }
      button {
        margin-top: 0.5rem;
        min-height: 48px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 12px;
        background: #fbbf24;
        color: #16130a;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>iMechanic can’t reach the server</h1>
      <p>
        The app and your garage are stored on iMechanic’s server, so this page
        needs a connection. Nothing has been lost — your scans are still there.
      </p>
      <p>
        Check your connection, then reopen the app. Reading codes, clearing
        codes and the severity verdict stay free.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
