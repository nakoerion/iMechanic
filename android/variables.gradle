ext {
    // Slice S10-T3 — Android 12 (API 31) minimum, owner-directed.
    //
    // Why 31 and not 23 (S9d's value): Android 12 is where BLE stops needing the
    // location permission. Below it, Android makes the OS hand a BLE scan the
    // location permission (there is no Bluetooth-only option), which is exactly
    // the permission this app must never request. Because minSdk is 31, the
    // legacy `BLUETOOTH`, `BLUETOOTH_ADMIN` and `ACCESS_FINE_LOCATION` entries
    // (all capped `maxSdkVersion="30"`) are dead on every device that can install
    // the app, so they have been DELETED from
    // android/app/src/main/AndroidManifest.xml. The result is a manifest with
    // ZERO location permissions — one fewer data-safety declaration to defend on
    // the Play listing and one fewer scary system prompt in front of a first
    // scan. Android 12+ covers the overwhelming majority of active devices and
    // all realistic BLE-adapter users (a €10 ELM327 dongle is a phone bought in
    // the last few years).
    minSdkVersion = 31
    compileSdkVersion = 36
    targetSdkVersion = 36
    // Slice S9d — the AndroidX versions Capacitor itself ships for API 36 (read
    // off `android-template/variables.gradle` and
    // `@capacitor/android@8.5.2/capacitor/build.gradle`). These are the versions
    // that are built and tested against compileSdk 36; the previous set
    // (androidxCore 1.15.0, androidxWebkit 1.12.1, androidxActivity 1.9.2)
    // targets SDK 35. Capacitor 7's own build.gradle reads every one of these
    // from `rootProject.ext`, so this file is the single place they are set.
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    // Slice S9d — deliberately NOT bumped to Capacitor 8's 14.0.1: cordova-android
    // 13+ raises the library's minSdk to 24. 10.1.1 is what Capacitor 7 ships and
    // it is a prebuilt AAR, so a newer compileSdk does not affect it. (The
    // original reason for staying at 10.1.1 was that minSdk 24 would have been
    // rejected against our minSdkVersion 23; that constraint is gone now that
    // S10-T3 raised minSdk to 31, but the version is still the one Capacitor 7
    // itself ships, so it stays put.)
    cordovaAndroidVersion = '10.1.1'
    // Slice S7: the Kotlin Gradle plugin version is NOT here. It must be readable
    // while the buildscript block is evaluated (before this file is applied), so it
    // lives in gradle.properties as `kotlinVersion`. Nothing else should use it.
}
