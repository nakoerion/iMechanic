// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Slice S9d: 8.10 is the first AGP whose maximum supported API level is
        // 36 (8.9 stops at 35, and AGP warns and suppresses nothing below that);
        // 8.10 still uses the Gradle 8.11.1 wrapper this project already pins,
        // so the SDK 36 bump costs no toolchain change. Capacitor 8 ships 8.13,
        // which would drag the wrapper to Gradle 8.13+.
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'com.google.gms:google-services:4.4.2'
        // Slice S7: the app is Kotlin. The version comes from gradle.properties,
        // not variables.gradle — the buildscript block is evaluated before the rest
        // of this script, so `apply from: "variables.gradle"` below is too late here.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
