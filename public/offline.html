<!doctype html>
<!-- Static offline fallback for the service worker (QA defect D1).
     Deliberately a plain file with zero user data: it is precached at
     install time and must never contain anything user-specific. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iMechanic — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1220;
        color: #e2e8f0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      main { max-width: 26rem; }
      svg { color: #fbbf24; width: 44px; height: 44px; }
      h1 { font-size: 1.35rem; margin: 18px 0 8px; }
      p { color: #94a3b8; font-size: 0.95rem; line-height: 1.55; margin: 0 0 22px; }
      button {
        background: #fbbf24;
        color: #0b1220;
        border: 0;
        border-radius: 9999px;
        padding: 10px 22px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
      <h1>You're offline</h1>
      <p>iMechanic needs a connection to load this page. Reconnect and try again — nothing you've saved is lost.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
